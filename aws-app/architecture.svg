<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowML" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="1080" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="48" y="56" font-size="30" font-weight="700" fill="#0f172a">Hotel Occupancy-Forecast</text>
  <text x="48" y="84" font-size="16" fill="#475569">Event-sourced CQRS on AWS with a SageMaker occupancy/demand forecast — deployed to 220133863472 / us-east-1</text>
  <text x="1552" y="60" text-anchor="end" font-size="13" fill="#64748b">Generated from mermaid-event-model · minimal tier</text>

  <!-- ===================== WRITE SIDE ===================== -->
  <rect x="48" y="120" width="470" height="380" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="72" y="150" font-size="15" font-weight="700" fill="#1e3a8a">WRITE SIDE — Command</text>

  <!-- Client -->
  <rect x="72" y="172" width="150" height="60" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="147" y="200" text-anchor="middle" font-size="14" font-weight="600" fill="#3730a3">Client / UI</text>
  <text x="147" y="219" text-anchor="middle" font-size="11" fill="#4f46e5">Guest · Manager</text>

  <!-- API GW POST -->
  <rect x="72" y="262" width="200" height="66" rx="8" fill="#fde68a" stroke="#b45309"/>
  <text x="172" y="287" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">API Gateway</text>
  <text x="172" y="306" text-anchor="middle" font-size="11" fill="#92400e">POST /api/records</text>
  <text x="172" y="321" text-anchor="middle" font-size="10" fill="#a16207">/prod stage</text>

  <!-- Command Lambda -->
  <rect x="72" y="358" width="230" height="120" rx="8" fill="#bfdbfe" stroke="#1e40af"/>
  <text x="187" y="383" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">Command Lambda</text>
  <text x="187" y="401" text-anchor="middle" font-size="11" fill="#1d4ed8">hotel-command-primary</text>
  <text x="187" y="421" text-anchor="middle" font-size="10" fill="#334155">readBoundary → validate →</text>
  <text x="187" y="435" text-anchor="middle" font-size="10" fill="#334155">appendWithinBoundary (DCB)</text>
  <text x="187" y="449" text-anchor="middle" font-size="10" fill="#334155">→ publishToKinesis</text>
  <text x="187" y="466" text-anchor="middle" font-size="10" font-style="italic" fill="#7c3aed">automation slices → invokeSageMaker</text>

  <line x1="147" y1="232" x2="147" y2="260" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="172" y1="328" x2="182" y2="356" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ===================== EVENT STORE (center) ===================== -->
  <rect x="560" y="120" width="470" height="380" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="584" y="150" font-size="15" font-weight="700" fill="#065f46">EVENT STORE — HotelEventStore stack</text>

  <!-- DynamoDB -->
  <rect x="600" y="182" width="390" height="130" rx="8" fill="#bbf7d0" stroke="#14532d"/>
  <text x="795" y="208" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">DynamoDB · HotelEvents</text>
  <text x="795" y="229" text-anchor="middle" font-size="11" fill="#166534">PK eventId · SK seq · immutable event log</text>
  <text x="795" y="248" text-anchor="middle" font-size="11" fill="#166534">TAGPOS guard items (optimistic concurrency)</text>
  <text x="795" y="270" text-anchor="middle" font-size="10" fill="#15803d">5 DCB GSIs: gsi_bookingId · gsi_email · gsi_paymentId</text>
  <text x="795" y="284" text-anchor="middle" font-size="10" fill="#15803d">gsi_roomNumber · gsi_roomType</text>
  <text x="795" y="302" text-anchor="middle" font-size="10" fill="#166534">DynamoDB Streams → projector</text>

  <!-- Kinesis -->
  <rect x="600" y="336" width="185" height="76" rx="8" fill="#c7d2fe" stroke="#4338ca"/>
  <text x="692" y="361" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">Kinesis Stream</text>
  <text x="692" y="379" text-anchor="middle" font-size="10" fill="#4338ca">hotel-events-primary</text>
  <text x="692" y="396" text-anchor="middle" font-size="10" fill="#4f46e5">downstream fan-out</text>

  <!-- DynamoDB Stream note -->
  <rect x="805" y="336" width="185" height="76" rx="8" fill="#e2e8f0" stroke="#64748b"/>
  <text x="897" y="361" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">DynamoDB Stream</text>
  <text x="897" y="379" text-anchor="middle" font-size="10" fill="#475569">NEW_IMAGE</text>
  <text x="897" y="396" text-anchor="middle" font-size="10" fill="#475569">event-source mapping</text>

  <!-- command lambda -> dynamodb -->
  <line x1="302" y1="418" x2="598" y2="360" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="430" y="380" font-size="11" fill="#334155" font-weight="600">append event</text>

  <!-- ===================== READ SIDE ===================== -->
  <rect x="1072" y="120" width="480" height="380" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="1096" y="150" font-size="15" font-weight="700" fill="#1e3a8a">READ SIDE — Query / Projection</text>

  <!-- Projector -->
  <rect x="1096" y="176" width="200" height="96" rx="8" fill="#bfdbfe" stroke="#1e40af"/>
  <text x="1196" y="201" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Projector Lambda</text>
  <text x="1196" y="219" text-anchor="middle" font-size="10" fill="#1d4ed8">hotel-projector-primary</text>
  <text x="1196" y="238" text-anchor="middle" font-size="10" fill="#334155">folds events into</text>
  <text x="1196" y="252" text-anchor="middle" font-size="10" fill="#334155">read models (Redis)</text>

  <!-- Redis -->
  <rect x="1330" y="176" width="196" height="96" rx="8" fill="#fecaca" stroke="#b91c1c"/>
  <text x="1428" y="201" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">ElastiCache Redis</text>
  <text x="1428" y="219" text-anchor="middle" font-size="10" fill="#b91c1c">read-model store</text>
  <text x="1428" y="238" text-anchor="middle" font-size="10" fill="#991b1b">Availability · Roster ·</text>
  <text x="1428" y="252" text-anchor="middle" font-size="10" fill="#991b1b">Demand Forecast · …</text>

  <!-- Query Lambda -->
  <rect x="1096" y="300" width="200" height="90" rx="8" fill="#bfdbfe" stroke="#1e40af"/>
  <text x="1196" y="325" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">Query Lambda</text>
  <text x="1196" y="343" text-anchor="middle" font-size="10" fill="#1d4ed8">hotel-query-primary</text>
  <text x="1196" y="363" text-anchor="middle" font-size="10" fill="#334155">reads Redis</text>

  <!-- API GET -->
  <rect x="1330" y="300" width="196" height="90" rx="8" fill="#fde68a" stroke="#b45309"/>
  <text x="1428" y="325" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">API Gateway</text>
  <text x="1428" y="345" text-anchor="middle" font-size="10" fill="#92400e">GET /api/records</text>
  <text x="1428" y="362" text-anchor="middle" font-size="10" fill="#92400e">GET /api/records/{id}</text>

  <!-- stream -> projector -->
  <line x1="990" y1="300" x2="1094" y2="240" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="1000" y="258" font-size="11" fill="#334155" font-weight="600">stream</text>
  <!-- projector -> redis -->
  <line x1="1296" y1="224" x2="1328" y2="224" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- redis -> query -->
  <line x1="1330" y1="345" x2="1298" y2="345" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
  <!-- query <-> api (GET) -->
  <line x1="1330" y1="330" x2="1298" y2="330" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- ===================== ML INFERENCE LOOP ===================== -->
  <rect x="48" y="560" width="1504" height="270" rx="12" fill="#ffffff" stroke="#a78bfa" stroke-width="2" filter="url(#shadow)"/>
  <text x="72" y="592" font-size="16" font-weight="700" fill="#6b21a8">ML INFERENCE LOOP — forecast_occupancy (Automation slice)</text>
  <text x="72" y="614" font-size="12" fill="#7c3aed">The prediction is recorded as a first-class domain event — durable, ordered, auditable, replayable.</text>

  <!-- Forecast tick -->
  <rect x="80" y="646" width="180" height="90" rx="8" fill="#fbf3a8" stroke="#854d0e"/>
  <text x="170" y="675" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">Forecast Tick</text>
  <text x="170" y="694" text-anchor="middle" font-size="10" fill="#854d0e">externalEvent (timer)</text>
  <text x="170" y="712" text-anchor="middle" font-size="10" fill="#a16207">EventBridge schedule</text>

  <!-- Occupancy demand read model -->
  <rect x="300" y="646" width="200" height="90" rx="8" fill="#bbf7d0" stroke="#14532d"/>
  <text x="400" y="672" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Occupancy Demand</text>
  <text x="400" y="690" text-anchor="middle" font-size="10" fill="#166534">read model (feature signal)</text>
  <text x="400" y="707" text-anchor="middle" font-size="10" fill="#15803d">fan-in: booked · checkedIn ·</text>
  <text x="400" y="721" text-anchor="middle" font-size="10" fill="#15803d">checkedOut · roomAdded</text>

  <!-- Demand forecaster automation -->
  <rect x="540" y="646" width="200" height="90" rx="8" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="640" y="675" text-anchor="middle" font-size="12" font-weight="700" fill="#5b21b6">Demand Forecaster</text>
  <text x="640" y="694" text-anchor="middle" font-size="10" fill="#6d28d9">automation (in cmd Lambda)</text>
  <text x="640" y="712" text-anchor="middle" font-size="10" fill="#7c3aed">builds feature vector</text>

  <!-- SageMaker -->
  <rect x="780" y="636" width="220" height="110" rx="8" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="890" y="666" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Amazon SageMaker</text>
  <text x="890" y="685" text-anchor="middle" font-size="10" fill="#6d28d9">InvokeEndpoint (real-time)</text>
  <text x="890" y="703" text-anchor="middle" font-size="10" fill="#6d28d9">occupancy / demand model</text>
  <text x="890" y="726" text-anchor="middle" font-size="10" font-style="italic" fill="#b91c1c">endpoint TBD — grant + env wired</text>

  <!-- occupancyForecasted event -->
  <rect x="1040" y="646" width="200" height="90" rx="8" fill="#fed7aa" stroke="#7c2d12"/>
  <text x="1140" y="672" text-anchor="middle" font-size="12" font-weight="700" fill="#7c2d12">Occupancy Forecasted</text>
  <text x="1140" y="690" text-anchor="middle" font-size="10" fill="#9a3412">domainEvent (prediction)</text>
  <text x="1140" y="707" text-anchor="middle" font-size="10" fill="#9a3412">+ modelVersion · endpointName</text>
  <text x="1140" y="721" text-anchor="middle" font-size="10" fill="#9a3412">(audit)</text>

  <!-- Demand Forecast view -->
  <rect x="1280" y="646" width="220" height="90" rx="8" fill="#bbf7d0" stroke="#14532d"/>
  <text x="1390" y="675" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">Demand Forecast UI</text>
  <text x="1390" y="694" text-anchor="middle" font-size="10" fill="#166534">Manager view</text>
  <text x="1390" y="712" text-anchor="middle" font-size="10" fill="#15803d">pricing · staffing decisions</text>

  <!-- flow arrows in ML loop -->
  <line x1="260" y1="691" x2="298" y2="691" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrowML)"/>
  <line x1="500" y1="691" x2="538" y2="691" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrowML)"/>
  <line x1="740" y1="691" x2="778" y2="691" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrowML)"/>
  <line x1="1000" y1="691" x2="1038" y2="691" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrowML)"/>
  <line x1="1240" y1="691" x2="1278" y2="691" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrowML)"/>
  <text x="890" y="628" text-anchor="middle" font-size="10" fill="#7c3aed">invoke</text>

  <!-- forecast event feeds back to store -->
  <line x1="1140" y1="646" x2="1140" y2="520" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowML)"/>
  <text x="1150" y="560" font-size="10" fill="#7c3aed">appended to event store (closes the loop)</text>

  <!-- ===================== FOOTER: deployment facts ===================== -->
  <rect x="48" y="860" width="1504" height="180" rx="12" fill="#0f172a" filter="url(#shadow)"/>
  <text x="72" y="892" font-size="14" font-weight="700" fill="#e2e8f0">Deployed footprint (minimal tier)</text>

  <text x="72" y="920" font-size="12" fill="#93c5fd" font-weight="700">HotelEventStore</text>
  <text x="72" y="940" font-size="11" fill="#cbd5e1">DynamoDB HotelEvents (+ Streams, 5 GSIs)</text>

  <text x="420" y="920" font-size="12" fill="#93c5fd" font-weight="700">HotelRegionalPrimary — 66 resources</text>
  <text x="420" y="940" font-size="11" fill="#cbd5e1">VPC · 1 NAT + 1 EIP · 2 security groups</text>
  <text x="420" y="957" font-size="11" fill="#cbd5e1">Kinesis stream · ElastiCache Redis</text>
  <text x="420" y="974" font-size="11" fill="#cbd5e1">3 Lambdas (command · query · projector)</text>
  <text x="420" y="991" font-size="11" fill="#cbd5e1">API Gateway (prod) · DynamoDB→projector mapping</text>

  <text x="900" y="920" font-size="12" fill="#c4b5fd" font-weight="700">Security</text>
  <text x="900" y="940" font-size="11" fill="#cbd5e1">Command Lambda role: sagemaker:InvokeEndpoint</text>
  <text x="900" y="957" font-size="11" fill="#cbd5e1">SAGEMAKER_ENDPOINT_NAME = "" (endpoint TBD)</text>

  <text x="1240" y="920" font-size="12" fill="#86efac" font-weight="700">Endpoint</text>
  <text x="1240" y="940" font-size="10.5" fill="#cbd5e1">GET /api/records → HTTP 200</text>
  <text x="1240" y="957" font-size="10" fill="#94a3b8">whvrws9dae.execute-api</text>
  <text x="1240" y="971" font-size="10" fill="#94a3b8">.us-east-1.amazonaws.com/prod/</text>

  <text x="72" y="1022" font-size="11" fill="#fca5a5">Standing cost: 1 NAT gateway + ElastiCache Redis run 24/7. Tear down with:  cdk destroy HotelRegionalPrimary HotelEventStore</text>

  <!-- Legend -->
  <g font-size="11" fill="#334155">
    <rect x="1120" y="1010" width="16" height="12" fill="#bfdbfe" stroke="#1e40af"/>
    <text x="1142" y="1020">Lambda</text>
    <rect x="1210" y="1010" width="16" height="12" fill="#bbf7d0" stroke="#14532d"/>
    <text x="1232" y="1020">Data / read model</text>
    <rect x="1360" y="1010" width="16" height="12" fill="#ddd6fe" stroke="#7c3aed"/>
    <text x="1382" y="1020">ML</text>
    <rect x="1430" y="1010" width="16" height="12" fill="#fde68a" stroke="#b45309"/>
    <text x="1452" y="1020">API / event</text>
  </g>
</svg>
